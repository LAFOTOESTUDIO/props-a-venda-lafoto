<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Painel de vendas — Props L.A. Foto</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Karla:wght@400;700&display=swap">
<style>
:root{
  --ground:#F7F8FA; --surface:#FFFFFF; --edge:#DDE3EC;
  --ink:#141A22; --ink-2:#4A5666; --ink-3:#77839A;
  --accent:#9E2B2B; --zap:#25A366; --zap-esc:#1c8250;
  --aviso:#B26A00; --aviso-fundo:#FFF4E0; --ok-fundo:#E7F6EE;
}
*{box-sizing:border-box}
body{margin:0; background:var(--ground); color:var(--ink); font:16px/1.5 Karla,"Helvetica Neue",Arial,sans-serif}
h2,h3{font-family:Fraunces,Georgia,serif; font-weight:600}
[hidden]{display:none !important}
#painel{min-height:100vh; padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(90px + env(safe-area-inset-bottom,0px))}
.p-caixa{max-width:760px; margin:0 auto}
.p-topo{display:flex; align-items:center; gap:12px; border-bottom:2px solid var(--ink); padding-bottom:12px; margin-bottom:16px}
.p-topo h2{margin:0; font-size:22px; margin-right:auto}
button,input,textarea{font:inherit}
.p-btn{background:var(--ink); color:#fff; border:none; padding:10px 16px; font-weight:700; cursor:pointer; border-radius:0}
.p-btn.verde{background:var(--zap)}
.p-btn.claro{background:var(--surface); color:var(--ink); border:1px solid var(--edge)}
.p-btn.grande{width:100%; padding:14px; font-size:17px}
.p-btn:disabled{opacity:.5; cursor:default}
input,textarea{border:1px solid var(--edge); background:var(--surface); padding:10px 12px; min-width:0; color:var(--ink); width:100%}
.p-login{background:var(--surface); border:1px solid var(--edge); padding:22px; max-width:420px}
.p-login p{margin:0 0 14px; color:var(--ink-2); font-size:15px}
.p-login input{margin-bottom:10px}
.p-msg{white-space:pre-line; margin:6px 0 0; font-size:14px; font-weight:700}
.p-msg:empty{display:none}
.p-msg.erro{color:var(--accent); background:#FBEAEA; border:1px solid var(--accent); padding:10px 12px}
.p-msg.ok{color:var(--zap-esc)}

/* aviso flutuante: aparece sempre na tela, mesmo rolado lá embaixo */
#toast{position:fixed; left:16px; right:16px; bottom:calc(16px + env(safe-area-inset-bottom,0px)); max-width:560px; margin:0 auto;
  padding:14px 16px; font-weight:700; font-size:15px; box-shadow:0 6px 24px rgba(0,0,0,.18); z-index:20; white-space:pre-line}
#toast.ok{background:var(--zap-esc); color:#fff}
#toast.erro{background:var(--accent); color:#fff}
#toast.info{background:var(--ink); color:#fff}

/* resumo / filtros */
.p-filtros{display:flex; gap:8px; flex-wrap:wrap; margin:14px 0 12px}
.p-filtros button{background:var(--surface); border:1px solid var(--edge); padding:8px 12px; font-weight:700; color:var(--ink-2); cursor:pointer}
.p-filtros button.on{background:var(--ink); color:#fff; border-color:var(--ink)}
.p-filtros b{font-size:13px; opacity:.8; margin-left:4px}
.p-buscas{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.3fr); gap:8px; margin-bottom:8px}
select{font:inherit; border:1px solid var(--edge); background:var(--surface); padding:10px 12px; color:var(--ink); min-width:0; width:100%}
.p-exporta{display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:12px}
.p-exporta span{margin-right:auto; font-size:14px; color:var(--ink-3)}
.p-exporta .p-btn{padding:8px 12px; font-size:14px}
@media (max-width:480px){ .p-buscas{grid-template-columns:1fr} }

/* cartão do pedido */
.ped{background:var(--surface); border:1px solid var(--edge); border-left:5px solid var(--aviso); padding:12px 14px; margin-bottom:10px}
.ped.pago{border-left-color:#3B7BD9}
.ped.entregue{border-left-color:var(--zap); opacity:.8}
.ped-cab{display:flex; gap:8px; align-items:baseline; flex-wrap:wrap}
.ped-quem{font-weight:700; font-size:17px; margin-right:auto}
.ped-quando{font-size:13px; color:var(--ink-3)}
.ped-tel{font-size:14.5px}
.ped-tel a{color:var(--zap-esc); font-weight:700}
.ped-obs{font-size:14px; color:var(--ink-2); margin-top:2px}
.ped ul{list-style:none; margin:8px 0; padding:0}
.ped li{display:flex; gap:8px; align-items:center; border-top:1px solid var(--edge); padding:6px 0; font-size:14.5px}
.ped li .oq{flex:1}
.ped li .rs{font-weight:700; white-space:nowrap}
.ped li .tira{background:none; border:none; color:var(--ink-3); font-size:13px; text-decoration:underline; cursor:pointer; padding:4px}
.ped li .tira.certeza{color:#fff; background:var(--accent); text-decoration:none; padding:4px 8px}
.ped-total{display:flex; justify-content:space-between; border-top:2px solid var(--ink); padding-top:6px; font-weight:700}
.ped-acoes{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:10px}
.ped-acoes .editar{grid-column:1 / -1}
.marca{border:2px solid var(--edge); background:var(--surface); padding:10px; font-weight:700; cursor:pointer; color:var(--ink-2)}
.marca.sim.pg{border-color:#3B7BD9; background:#EAF1FC; color:#1F4F99}
.marca.sim.en{border-color:var(--zap); background:var(--ok-fundo); color:var(--zap-esc)}
.selo{font-size:12px; font-weight:700; padding:2px 7px; text-transform:uppercase; letter-spacing:.03em}
.selo.falta{background:var(--aviso-fundo); color:var(--aviso)}
.selo.pg{background:#EAF1FC; color:#1F4F99}
.selo.en{background:var(--ok-fundo); color:var(--zap-esc)}

/* formulário de pedido */
.form{background:var(--surface); border:1px solid var(--edge); padding:16px}
.form h3{margin:0 0 12px; font-size:20px}
.campos{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.campos .largo{grid-column:1 / -1}
.form label{display:flex; flex-direction:column; font-size:12.5px; color:var(--ink-3); font-weight:700; gap:3px}
.form .sub{font-size:13px; color:var(--ink-3); margin:16px 0 6px; font-weight:700; text-transform:uppercase; letter-spacing:.04em}
.escolhidas .lin{display:grid; grid-template-columns:1fr 64px 96px auto; gap:6px; align-items:end; border-top:1px solid var(--edge); padding:8px 0}
.escolhidas .lin .n{font-weight:700; font-size:14.5px; align-self:center}
.escolhidas .lin .n small{display:block; font-weight:400; color:var(--ink-3)}
.escolhidas .lin button{background:none; border:none; color:var(--accent); font-size:22px; line-height:1; cursor:pointer; padding:6px}
.escolhidas .vazio{color:var(--ink-3); font-size:14.5px; margin:4px 0}
.achadas{max-height:260px; overflow:auto; border:1px solid var(--edge); border-top:none}
.achadas button{display:flex; width:100%; justify-content:space-between; gap:10px; text-align:left; background:var(--surface); border:none;
  border-bottom:1px solid var(--edge); padding:10px 12px; cursor:pointer; font-size:14.5px}
.achadas button:hover{background:var(--ground)}
.achadas button span{color:var(--ink-3); white-space:nowrap}
.form .total{display:flex; justify-content:space-between; font-weight:700; font-size:18px; border-top:2px solid var(--ink); margin-top:8px; padding-top:8px}
.form .check{flex-direction:row; align-items:center; gap:10px; font-size:16px; color:var(--ink); margin:14px 0; cursor:pointer}
.form .check input{width:22px; height:22px; margin:0}
.form .botoes{display:flex; gap:8px; margin-top:6px}
.form .botoes .p-btn{flex:1; padding:14px}

/* estoque */
/* abas */
.abas{display:grid; grid-template-columns:1fr 1fr; margin-bottom:16px; border:2px solid var(--ink)}
.abas button{background:var(--surface); border:none; padding:12px 8px; font-weight:700; font-size:15.5px; cursor:pointer; color:var(--ink)}
.abas button.on{background:var(--ink); color:#fff}
.abas b{background:var(--aviso); color:#fff; font-size:12.5px; padding:1px 7px; margin-left:4px; border-radius:10px}
.abas b:empty{display:none}

/* peças (jeito rápido) */
#pBuscaPeca{margin-bottom:12px}
.it{background:var(--surface); border:1px solid var(--edge); padding:12px 14px; margin-bottom:8px}
.it-lin{display:flex; align-items:center; gap:10px; flex-wrap:wrap}
.it-nome{flex:1; min-width:170px; font-weight:700; font-size:15px}
.it-resta{font-size:13px; color:var(--ink-3)}
.it-resta.zero{color:var(--accent); font-weight:700}
.it-form{display:none; margin-top:12px; border-top:1px solid var(--edge); padding-top:12px}
.it.aberto .it-form{display:block}
.it-form .g{display:grid; grid-template-columns:70px 110px 1fr 1fr; gap:8px; align-items:end}
.it-form label{display:flex; flex-direction:column; font-size:12px; color:var(--ink-3); font-weight:700; gap:3px}
.it-form .junta{margin-top:8px}
.it-form .acoes{display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; align-items:center}
.it-form .acoes .salvar{flex:1; padding:13px; font-size:16px}
.it-form .corrige{display:flex; gap:8px; align-items:end; margin-top:14px; padding-top:10px; border-top:1px dashed var(--edge); font-size:13px; color:var(--ink-3)}
.it-form .corrige input{width:70px}
@media (max-width:560px){ .it-form .g{grid-template-columns:70px 1fr} .it-form .g .l2{grid-column:1 / -1} }
@media (max-width:480px){
  .campos{grid-template-columns:1fr}
  .escolhidas .lin{grid-template-columns:1fr 56px 84px auto}
}
</style>
</head>
<body>
<div id="painel">
  <div class="p-caixa">
    <div class="p-topo"><h2>Painel de vendas</h2><button class="p-btn claro" id="pSair" hidden>Sair</button></div>
    <div id="pLogin" class="p-login">
      <p id="pLoginTxt">Digite a senha do painel.</p>
      <input type="password" id="pSenha" placeholder="Senha" autocomplete="current-password">
      <input type="password" id="pSenha2" placeholder="Repita a senha" autocomplete="new-password" hidden>
      <button class="p-btn" id="pEntrar">Entrar</button>
      <p class="p-msg" id="pLoginMsg"></p>
    </div>

    <div id="pConteudo" hidden>
      <div class="abas" id="pAbas">
        <button data-aba="pecas" class="on">Peças</button>
        <button data-aba="pedidos">Pedidos e entregas <b id="pAEntregar"></b></button>
      </div>

      <!-- peças: o jeito rápido — procura, toca em Vendido, salva -->
      <div id="pPecas">
        <input type="search" id="pBuscaPeca" placeholder="Buscar peça…">
        <div id="pItens"></div>
      </div>

      <!-- lista de pedidos -->
      <div id="pLista" hidden>
        <button class="p-btn verde grande" id="pNovo">+ Venda com várias peças</button>
        <div class="p-filtros" id="pFiltros"></div>
        <div class="p-buscas">
          <select id="pPessoa" aria-label="Filtrar por pessoa"><option value="">Todas as pessoas</option></select>
          <input type="search" id="pBusca" placeholder="Buscar nome, telefone ou peça…">
        </div>
        <div class="p-exporta">
          <span id="pConta"></span>
          <button class="p-btn claro" id="pCopiar" title="Copia em formato de tabela para colar no Excel ou Google Planilhas">Copiar tabela</button>
          <button class="p-btn claro" id="pBaixar" title="Baixa um arquivo que abre no Excel ou Google Planilhas">Baixar planilha</button>
        </div>
        <div id="pPedidos"></div>
      </div>

      <!-- nova venda / editar pedido -->
      <div id="pForm" class="form" hidden>
        <h3 id="fTitulo">Nova venda</h3>
        <div class="campos">
          <label>Nome<input id="fNome" autocomplete="off" maxlength="80"></label>
          <label>Sobrenome<input id="fSobrenome" autocomplete="off" maxlength="80"></label>
          <label class="largo">Telefone / WhatsApp<input id="fTel" type="tel" autocomplete="off" maxlength="40" placeholder="(21) 9…"></label>
          <label class="largo">Observação<input id="fObs" autocomplete="off" maxlength="300" placeholder="ex.: vai buscar sábado; pagou no Pix"></label>
        </div>
        <p style="font-size:13px;color:var(--ink-3);margin:6px 0 0">Nada disso é obrigatório.</p>

        <div class="sub" id="fJaTem" hidden>Peças já neste pedido</div>
        <div id="fAntigas"></div>

        <div class="sub" id="fSubPecas">Peças</div>
        <div class="escolhidas" id="fEscolhidas"></div>
        <input type="search" id="fBusca" placeholder="Digite para achar a peça e adicionar…" autocomplete="off">
        <div class="achadas" id="fAchadas"></div>
        <div class="total"><span>Total</span><span id="fTotal">R$ 0</span></div>

        <label class="check"><input type="checkbox" id="fPago"> Já pagou</label>
        <p class="p-msg" id="fMsg"></p>
        <div class="botoes">
          <button class="p-btn claro" id="fCancelar">Cancelar</button>
          <button class="p-btn verde" id="fSalvar">Salvar venda</button>
        </div>
      </div>
    </div>
  </div>
</div>
<div id="toast" hidden></div>

<script>
(function(){
  // Neon Data API: pega um passe anônimo e chama as funções do banco (estado, entrar, pedido_salvar...)
  var AUTH = "https://ep-purple-mouse-b7m0zp74.neonauth.c-13.us-east-1.aws.neon.tech/neondb/auth";
  var REST = "https://ep-purple-mouse-b7m0zp74.apirest.c-13.us-east-1.aws.neon.tech/neondb/rest/v1";
  var passe = null;
  // o banco do Neon "dorme" quando fica parado; enquanto acorda, a conexão falha.
  // Por isso toda chamada insiste sozinha por uns 15 segundos antes de desistir.
  function insiste(tentar, vez){
    vez = vez || 0;
    return tentar().catch(function(e){
      if (vez >= 6) throw e;
      if (window.aoInsistir) window.aoInsistir(vez);
      return new Promise(function(ok){ setTimeout(ok, 800 + vez * 700); })
        .then(function(){ return insiste(tentar, vez + 1); });
    });
  }
  function pegaPasse(){
    if (!passe) passe = insiste(function(){
      return fetch(AUTH + "/token/anonymous").then(function(r){ if (!r.ok) throw new Error("passe " + r.status); return r.json(); })
        .then(function(d){ if (!d.token) throw new Error("sem passe"); return d.token; });
    }).catch(function(e){ passe = null; throw e; });
    return passe;
  }
  function rpc(nome, args, deNovo){
    return pegaPasse().then(function(t){
      return insiste(function(){
        return fetch(REST + "/rpc/" + nome, {method: "POST",
          headers: {"Authorization": "Bearer " + t, "Content-Type": "application/json"}, body: JSON.stringify(args || {})})
          .then(function(r){ if (r.status >= 500) throw new Error("servidor " + r.status); return r; });
      });
    }).then(function(r){
      if (r.status === 401 && !deNovo) { passe = null; return rpc(nome, args, true); }
      return r.json();
    });
  }
  var $ = function(id){ return document.getElementById(id); };
  var SEM_CONEXAO = "Não consegui falar com o servidor. Confira a internet e tente de novo. " +
    "Se continuar, o antivírus ou o bloqueador de anúncios pode estar barrando o endereço do painel.";
  var ultimoErro = null;
  // quando não conecta, testa o que funciona neste computador e mostra um código para mandar à Amanda
  function diagnostico(alvo){
    var linhas = [], ua = navigator.userAgent;
    var nav = /Edg\//.test(ua) ? "Edge" : /OPR\//.test(ua) ? "Opera" : /Firefox\//.test(ua) ? "Firefox" :
              /Chrome\//.test(ua) ? "Chrome" : /Safari\//.test(ua) ? "Safari" : "outro";
    linhas.push("navegador: " + nav + (/Mobile/.test(ua) ? " (celular)" : "") + " · online: " + navigator.onLine);
    if (ultimoErro) linhas.push("erro: " + ultimoErro.name + " – " + ultimoErro.message);
    function teste(nome, url){
      var t0 = Date.now();
      return fetch(url, {cache: "no-store"}).then(function(r){ return nome + ": ok " + r.status + " (" + (Date.now() - t0) + " ms)"; })
        .catch(function(e){ return nome + ": FALHOU (" + e.message + ", " + (Date.now() - t0) + " ms)"; });
    }
    Promise.all([
      teste("servidor", AUTH + "/token/anonymous"),
      teste("github", "https://lafotoestudio.github.io/props-a-venda-lafoto/painel.html"),
      teste("google", "https://www.google.com/favicon.ico").then(function(x){ return x.replace("FALHOU", "sem acesso (normal)"); })
    ]).then(function(res){
      alvo.textContent = SEM_CONEXAO + "\n\nDiagnóstico — mande um print disto para a Amanda:\n" + linhas.concat(res).join("\n");
    });
  }
  function real(n){ return "R$ " + Number(n).toLocaleString("pt-BR", {minimumFractionDigits: 0, maximumFractionDigits: 2}); }
  function esc(t){ var d = document.createElement("div"); d.textContent = t == null ? "" : t; return d.innerHTML; }
  // aceita "45", "45,50", "1.200,00" e "R$ 45"
  function numero(t){
    t = String(t == null ? "" : t).replace(/[^\d,.]/g, "");
    if (!t) return null;
    if (t.indexOf(",") > -1) t = t.replace(/\./g, "").replace(",", ".");
    var n = Number(t); return isFinite(n) ? n : NaN;
  }

  // ── aviso flutuante
  var tTimer = null;
  function toast(t, tipo, fica){
    var el = $("toast"); el.textContent = t; el.className = tipo || "info"; el.hidden = false;
    clearTimeout(tTimer); if (!fica) tTimer = setTimeout(function(){ el.hidden = true; }, tipo === "erro" ? 9000 : 3500);
  }
  $("toast").addEventListener("click", function(){ this.hidden = true; });

  // ── painel
  var senha = "", dados = null, criando = false, precos = {}, filtro = "entregar", ocupado = false;
  // preço anunciado de cada peça, lido do catálogo, para sugerir no campo de valor
  ["index.html", "previa.html"].forEach(function(arq){
    fetch(arq).then(function(r){ return r.ok ? r.text() : ""; }).then(function(t){
      new DOMParser().parseFromString(t, "text/html").querySelectorAll("article.item").forEach(function(a){
        var b = a.querySelector(".btn"); if (b && (arq === "previa.html" || !precos[a.id])) precos[a.id] = b.dataset.preco; });
    }).catch(function(){});
  });
  try { senha = localStorage.getItem("painelProps") || ""; } catch(e) {}

  function chama(nome, corpo){
    corpo = corpo || {}; corpo.senha = senha;
    return rpc(nome, corpo)
      .catch(function(e){ ultimoErro = e; throw new Error(SEM_CONEXAO); })
      .then(function(d){ if (d.erro || d.message) throw new Error(d.erro || d.message); return d; });
  }
  // enquanto o banco acorda, mostra que está tentando em vez de parecer travado
  window.aoInsistir = function(){
    if ($("pConteudo").hidden) { var lm = $("pLoginMsg"); lm.className = "p-msg"; lm.textContent = "Conectando… (o servidor está acordando, só um instante)"; }
    else toast("Conectando… o servidor está acordando, só um instante.", "info", true);
  };

  function abre(){
    if (senha) return entrar();
    rpc("tem_senha").then(function(d){
      $("pLoginMsg").textContent = "";
      criando = !d.tem;
      $("pSenha2").hidden = !criando;
      $("pLoginTxt").textContent = criando
        ? "Primeiro acesso: crie a senha do painel (pelo menos 8 caracteres). Depois é só passar para quem vai usar."
        : "Digite a senha do painel.";
      $("pEntrar").textContent = criando ? "Criar senha e entrar" : "Entrar";
      $("pSenha").focus();
    }).catch(function(e){ ultimoErro = e; $("pLoginMsg").className = "p-msg erro"; diagnostico($("pLoginMsg")); });
  }
  function sair(){
    senha = ""; try { localStorage.removeItem("painelProps"); } catch(e) {}
    $("pSenha").value = ""; $("pConteudo").hidden = true; $("pLogin").hidden = false; $("pSair").hidden = true; abre();
  }
  function entrar(){
    var lm = $("pLoginMsg"); lm.className = "p-msg erro"; lm.textContent = "";
    if (!senha) senha = $("pSenha").value;
    if (criando && senha !== $("pSenha2").value) { lm.textContent = "As duas senhas não são iguais."; senha = ""; return; }
    $("pEntrar").disabled = true;
    chama(criando ? "criar-senha" : "entrar").then(function(d){
      try { localStorage.setItem("painelProps", senha); } catch(e) {}
      criando = false; $("pLogin").hidden = true; $("pConteudo").hidden = false; $("toast").hidden = true; mostra(d);
    }).catch(function(e){
      senha = ""; try { localStorage.removeItem("painelProps"); } catch(x) {}
      $("pLogin").hidden = false; $("pConteudo").hidden = true;
      lm.textContent = e.message === "Senha errada."
        ? "Senha errada. Confira se digitou igual, com as mesmas letras maiúsculas e minúsculas, sem espaço no começo ou no fim. " +
          "Depois de 8 tentativas erradas o painel trava por 15 minutos."
        : e.message;
      if (e.message === SEM_CONEXAO) diagnostico(lm);
      $("pSenha").value = ""; $("pSenha").focus();
    }).then(function(){ $("pEntrar").disabled = false; });
  }

  // ── lista de pedidos
  function quem(p){ return [p.nome, p.sobrenome].filter(Boolean).join(" ") || "Sem nome"; }
  // sem acento e minúsculo: "Cecília" acha digitando "cecilia"
  function sem(t){ return String(t || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase(); }
  var visiveis = [];
  function zap(tel){
    var d = String(tel || "").replace(/\D/g, ""); if (d.length < 10) return "";
    if (d.length <= 11) d = "55" + d;
    return "https://wa.me/" + d;
  }
  var FILTROS = [

  // ── exportar: uma linha por peça, com os dados da pessoa repetidos (fácil de filtrar e somar na planilha)
  function tabela(){
    var cab = ["Data", "Nome", "Sobrenome", "Telefone", "Peça", "Qtd", "Valor da peça", "Total do pedido", "Pago", "Entregue", "Entregue em", "Observação", "Pedido nº"];
    var linhas = [];
    visiveis.slice().reverse().forEach(function(p){
      (p.pecas || []).forEach(function(x){
        linhas.push([data(p.criado_em), p.nome || "", p.sobrenome || "", p.telefone || "", x.nome, x.quantidade,
          x.valor == null ? "" : num(x.valor), num(p.total || 0), p.pago ? "sim" : "não", p.entregue ? "sim" : "não",
          p.entregue_em ? data(p.entregue_em) : "", p.obs || "", p.id]);

  function data(t){ return new Date(t).toLocaleDateString("pt-BR"); }

    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(feito, function(){ copiaVelho(txt); feito(); });
    else { copiaVelho(txt); feito(); }

  function copiaVelho(txt){

    var b = $("fSalvar"), txt = b.textContent; b.disabled = true; b.textContent = "Salvando…"; ocupado = true;
    var nomeFeito = [$("fNome").value.trim(), $("fSobrenome").value.trim()].filter(Boolean).join(" ") || "Venda";
    chama("pedido_salvar", {pedido_id: editando ? editando.id : null, nome: $("fNome").value, sobrenome: $("fSobrenome").value,
      telefone: $("fTel").value, obs: $("fObs").value, pago: $("fPago").checked, pecas: pecas})
      .then(function(d){
        fechaForm(); mostra(d); window.scrollTo(0, 0);
        toast(nomeFeito + (pecas.length ? " — salvo com " + pecas.length + " peça(s)." : " — dados atualizados."), "ok");
      })
      .catch(function(err){ fm.textContent = err.message; toast(err.message, "erro"); })
      .then(function(){ b.disabled = false; b.textContent = txt; ocupado = false; });
  });

  $("pEntrar").addEventListener("click", entrar);
  $("pSenha").addEventListener("keydown", function(e){ if (e.key === "Enter" && !criando) entrar(); });
  $("pSenha2").addEventListener("keydown", function(e){ if (e.key === "Enter") entrar(); });
  $("pSair").addEventListener("click", sair);

  abre();
})();
</script>
</body>
</html>
